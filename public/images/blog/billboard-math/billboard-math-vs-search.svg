<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Billboard math versus how search pays</title>
  <desc id="d">Left panel, billboard math. Three of your signs and one competitor sign along a highway. You expect 75 of every 100 drivers. Right panel, how search pays. Ten ranked results. First place takes about 30 of 100 clicks, second 16, third 10, fourth 7, fifth 5, sixth 3, seventh 3, eighth 2, ninth 1, tenth 1. One site in third place takes 10. The same company split into three sites in fifth, eighth and tenth place takes 8 together.</desc>
  <style>
    .paper { fill: #faf7f2; }
    .ink { fill: #1a1814; }
    .ink-s { stroke: #1a1814; }
    .mute { fill: #6b6359; }
    .rule { stroke: #d6cdb5; stroke-width: 2; }
    .you { fill: #c47d5a; }
    .you-s { stroke: #c47d5a; }
    .them { fill: #a89e8a; }
    .ghost { fill: none; stroke: #a89e8a; stroke-width: 2; }
    .serif { font-family: "Newsreader", "Iowan Old Style", Charter, Georgia, "Times New Roman", serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
    .h1 { font-size: 44px; font-weight: 600; }
    .h2 { font-size: 30px; font-weight: 600; }
    .body { font-size: 22px; }
    .small { font-size: 18px; }
    .tiny { font-size: 15px; letter-spacing: 0.12em; }
    .num { font-size: 22px; }
    .big { font-size: 54px; font-weight: 600; }
  </style>

  <rect class="paper" x="0" y="0" width="1600" height="1000"/>

  <!-- Title -->
  <text class="serif h1 ink" x="80" y="92">Billboard math versus how search pays</text>
  <text class="serif body mute" x="80" y="132">Same 100 people. Two very different ways to count who sees you.</text>
  <line class="rule" x1="80" y1="160" x2="1520" y2="160"/>

  <!-- ===== LEFT PANEL: BILLBOARD MATH ===== -->
  <text class="mono tiny mute" x="80" y="205">ON THE HIGHWAY</text>
  <text class="serif h2 ink" x="80" y="245">Billboard math</text>
  <text class="serif body ink" x="80" y="285">Every sign gets seen. More signs, more share.</text>

  <!-- road -->
  <rect class="ink" x="80" y="640" width="660" height="10"/>
  <g class="them" opacity="0.9">
    <rect x="130" y="655" width="24" height="6"/>
    <rect x="230" y="655" width="24" height="6"/>
    <rect x="330" y="655" width="24" height="6"/>
    <rect x="430" y="655" width="24" height="6"/>
    <rect x="530" y="655" width="24" height="6"/>
    <rect x="630" y="655" width="24" height="6"/>
  </g>

  <!-- billboards: three yours, one theirs -->
  <g>
    <!-- post + board 1 (you) -->
    <rect class="ink" x="140" y="470" width="8" height="170"/>
    <rect class="you" x="94" y="360" width="140" height="110" rx="4"/>
    <text class="serif h2 paper" x="164" y="424" text-anchor="middle">You</text>

    <!-- board 2 (you) -->
    <rect class="ink" x="310" y="470" width="8" height="170"/>
    <rect class="you" x="264" y="360" width="140" height="110" rx="4"/>
    <text class="serif h2 paper" x="334" y="424" text-anchor="middle">You</text>

    <!-- board 3 (you) -->
    <rect class="ink" x="480" y="470" width="8" height="170"/>
    <rect class="you" x="434" y="360" width="140" height="110" rx="4"/>
    <text class="serif h2 paper" x="504" y="424" text-anchor="middle">You</text>

    <!-- board 4 (them) -->
    <rect class="ink" x="650" y="470" width="8" height="170"/>
    <rect class="them" x="604" y="360" width="140" height="110" rx="4"/>
    <text class="serif h2 paper" x="674" y="424" text-anchor="middle">Them</text>
  </g>

  <!-- expected split bar -->
  <text class="serif small mute" x="80" y="720">What you expect</text>
  <rect class="you" x="80" y="735" width="495" height="34"/>
  <rect class="them" x="575" y="735" width="165" height="34"/>
  <text class="serif num paper" x="96" y="760">75 of 100 for you</text>
  <text class="serif num paper" x="588" y="760">25 for them</text>

  <text class="serif body ink" x="80" y="830">Right on a highway.</text>
  <text class="serif body ink" x="80" y="862">Wrong in search.</text>

  <!-- divider -->
  <line class="rule" x1="800" y1="190" x2="800" y2="900"/>

  <!-- ===== RIGHT PANEL: HOW SEARCH PAYS ===== -->
  <text class="mono tiny mute" x="860" y="205">ON A SEARCH RESULTS PAGE</text>
  <text class="serif h2 ink" x="860" y="245">How search pays</text>
  <text class="serif body ink" x="860" y="285">Results are a line. The front takes most of the clicks.</text>

  <!-- bars: 10 positions. scale: 30 clicks = 480px -> 16px per click. x0 = 940 -->
  <!-- values: 30,16,10,7,5,3,3,2,1,1 -->
  <g class="serif num">
    <!-- 1 -->
    <text class="mute" x="900" y="343" text-anchor="end">1</text>
    <rect class="ghost" x="940" y="322" width="480" height="30"/>
    <text class="ink" x="1432" y="345">30 of 100</text>
    <!-- 2 -->
    <text class="mute" x="900" y="389" text-anchor="end">2</text>
    <rect class="ghost" x="940" y="368" width="256" height="30"/>
    <text class="ink" x="1208" y="391">16</text>
    <!-- 3 : ONE SITE -->
    <text class="ink" x="900" y="435" text-anchor="end">3</text>
    <rect class="ink" x="940" y="414" width="160" height="30"/>
    <text class="ink" x="1112" y="437">10</text>
    <text class="serif small ink" x="1160" y="437">One site, here. 10 of 100.</text>
    <!-- 4 -->
    <text class="mute" x="900" y="481" text-anchor="end">4</text>
    <rect class="ghost" x="940" y="460" width="112" height="30"/>
    <text class="ink" x="1064" y="483">7</text>
    <!-- 5 : split site A -->
    <text class="ink" x="900" y="527" text-anchor="end">5</text>
    <rect class="you" x="940" y="506" width="80" height="30"/>
    <text class="ink" x="1032" y="529">5</text>
    <!-- 6 -->
    <text class="mute" x="900" y="573" text-anchor="end">6</text>
    <rect class="ghost" x="940" y="552" width="48" height="30"/>
    <text class="ink" x="1000" y="575">3</text>
    <!-- 7 -->
    <text class="mute" x="900" y="619" text-anchor="end">7</text>
    <rect class="ghost" x="940" y="598" width="48" height="30"/>
    <text class="ink" x="1000" y="621">3</text>
    <!-- 8 : split site B -->
    <text class="ink" x="900" y="665" text-anchor="end">8</text>
    <rect class="you" x="940" y="644" width="32" height="30"/>
    <text class="ink" x="984" y="667">2</text>
    <!-- 9 -->
    <text class="mute" x="900" y="711" text-anchor="end">9</text>
    <rect class="ghost" x="940" y="690" width="16" height="30"/>
    <text class="ink" x="968" y="713">1</text>
    <!-- 10 : split site C -->
    <text class="ink" x="900" y="757" text-anchor="end">10</text>
    <rect class="you" x="940" y="736" width="16" height="30"/>
    <text class="ink" x="968" y="759">1</text>
  </g>

  <!-- bracket for the three split sites -->
  <path class="you-s" d="M1200 506 L1224 506 L1224 766 L1200 766" fill="none" stroke-width="3"/>
  <text class="serif small ink" x="1244" y="620">The same company</text>
  <text class="serif small ink" x="1244" y="646">split into three sites.</text>
  <text class="serif small you" x="1244" y="672">5 + 2 + 1. Eight of 100.</text>

  <!-- page two -->
  <line class="rule" x1="860" y1="790" x2="1520" y2="790"/>
  <text class="serif small mute" x="860" y="820">Page two. Almost nothing. Ahrefs puts 96.6% of clicks on page one.</text>

  <text class="serif body ink" x="860" y="862">Three sites do not stack. They stand in one line.</text>

  <!-- footer -->
  <line class="rule" x1="80" y1="905" x2="1520" y2="905"/>
  <text class="serif small mute" x="80" y="940">Click shares are Ubersuggest estimates for a ten-result page, September 2026. An AI answer above the results cuts the top result's clicks by about 58% more (Ahrefs, Dec. 2025 data).</text>
  <text class="mono tiny mute" x="1520" y="975" text-anchor="end">CODYASMITH.COM</text>
</svg>
